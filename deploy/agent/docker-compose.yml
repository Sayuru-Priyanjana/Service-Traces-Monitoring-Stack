# Monitoring agent for every application server (and the monitoring server itself).
#   node-exporter     :9100  host metrics + systemd unit states   (scraped by Prometheus)
#   process-exporter  :9256  per-service CPU / memory / threads    (scraped by Prometheus)
#   otel-agent        127.0.0.1:4317/4318  OTLP from local apps -> gateway collector
#                     (profile "otel", enabled via COMPOSE_PROFILES in .env)
# All use the host network, so ufw rules apply to them (unlike Docker-published ports).
name: monitoring-agent

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --path.rootfs=/host
      - --web.listen-address=${EXPORTER_BIND_IP:-0.0.0.0}:9100
      - --collector.systemd
      - --collector.systemd.unit-include=${SYSTEMD_UNITS:?set SYSTEMD_UNITS in .env}
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containers/.+)($$|/)
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
      - /run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro   # systemd collector
    deploy:
      resources:
        limits: { memory: 128m }
    logging: *logging
    restart: unless-stopped

  process-exporter:
    image: ncabatoff/process-exporter:0.8.7
    command:
      - --procfs=/host/proc
      - --config.path=/config/config.yml
      - --web.listen-address=${EXPORTER_BIND_IP:-0.0.0.0}:9256
    network_mode: host
    privileged: true   # needed to read /proc of processes owned by other users
    volumes:
      - /proc:/host/proc:ro
      - ./process-exporter/config.yml:/config/config.yml:ro
    deploy:
      resources:
        limits: { memory: 128m }
    logging: *logging
    restart: unless-stopped

  otel-agent:
    profiles: [otel]
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    network_mode: host
    environment:
      HOST_NAME: ${HOST_NAME:?set HOST_NAME in .env}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
      GATEWAY_OTLP_ENDPOINT: ${GATEWAY_OTLP_ENDPOINT:?set GATEWAY_OTLP_ENDPOINT in .env}
      GATEWAY_TLS_INSECURE: ${GATEWAY_TLS_INSECURE:-true}
      AGENT_OTLP_GRPC_PORT: ${AGENT_OTLP_GRPC_PORT:-4317}
      AGENT_OTLP_HTTP_PORT: ${AGENT_OTLP_HTTP_PORT:-4318}
    volumes:
      - ./otel-agent/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      # Disk buffer for data the gateway hasn't accepted yet. deploy.sh creates it owned by
      # 10001 (the image's user); a named volume would be root-owned and unwritable.
      - ./data/otel-queue:/var/lib/otelcol/queue
    deploy:
      resources:
        limits: { memory: 512m }
    logging: *logging
    restart: unless-stopped
