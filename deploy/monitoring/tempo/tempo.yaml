# Grafana Tempo 3.1 - monolithic mode (-target=all), same layout as the lab.
# Production changes compared to the lab: 7-day retention and an object-storage option.

stream_over_http_enabled: true   # streaming search results in Grafana

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317   # only reachable on the compose network (not published)

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
    # Object storage instead of local disk (recommended for longer retention or
    # high volume). Replace `backend: local` and the `local:` block with e.g.:
    # backend: s3
    # s3:
    #   bucket: tempo-traces
    #   endpoint: s3.eu-west-1.amazonaws.com   # or your MinIO host:9000
    #   access_key: ...                         # or use an IAM role / env vars
    #   secret_key: ...
    #   insecure: false

# How long traces are kept. Disk use is roughly
#   spans/sec x avg span size (~500 B-1 KB) x retention seconds (before compression).
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 168h
backend_worker:
  compaction:
    block_retention: 168h

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    service_graphs:
      # Client spans with these attributes but no matching server span become
      # "virtual" nodes (e.g. redis via db.system) in the service graph.
      peer_attributes: [peer.service, db.name, db.system]
    span_metrics:
      # Extra label on traces_spanmetrics_*: user_action (route template set by the
      # entry service and carried as baggage). Only add low-cardinality attributes here.
      dimensions: [user.action]

overrides:
  defaults:
    compaction:
      block_retention: 168h
    metrics_generator:
      processors: [service-graphs, span-metrics]
      generate_native_histograms: classic   # traces_spanmetrics_latency_bucket (+exemplars)

usage_report:
  reporting_enabled: false
