# Alertmanager: where alerts go. Out of the box alerts are only visible in Grafana
# (Alerting -> Alert rules / Silences) and in Alertmanager itself. Configure a receiver
# below, then `sudo ./deploy.sh` (or `docker compose restart alertmanager`).
# Validate with: docker run --rm -v "$PWD/alertmanager:/c" --entrypoint amtool prom/alertmanager:v0.28.1 check-config /c/alertmanager.yml

route:
  receiver: default
  group_by: [alertname, instance, service_name]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  # Example: send critical alerts somewhere else.
  # routes:
  #   - matchers: [severity="critical"]
  #     receiver: oncall

# While a host is unreachable, don't also page for every service on it.
inhibit_rules:
  - source_matchers: [alertname="TargetDown", job="node"]
    target_matchers: [severity=~"warning|critical"]
    equal: [instance]

receivers:
  - name: default
    # E-mail:
