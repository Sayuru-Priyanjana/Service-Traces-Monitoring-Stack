# Grafana Tempo 3.1 - monolithic mode (-target=all): no Kafka needed, local disk storage.
# Format checked against the v3.1.0 docs (docs/sources/tempo/configuration). In Tempo 3 the
# old `compactor:` block is gone; retention lives in the `compaction` settings used by the
# backend scheduler/worker, plus a per-tenant override.

stream_over_http_enabled: true   # streaming search results in Grafana

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317   # only reachable on the compose network (not published)

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Keep trace blocks for 72h.
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 72h
backend_worker:
  compaction:
    block_retention: 72h

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    service_graphs:
      # client spans with these attributes but no matching server span become
      # "virtual" nodes, e.g. redis (db.system) in the service graph
      peer_attributes: [peer.service, db.name, db.system]
    span_metrics:
      # Extra labels on traces_spanmetrics_* (looked up in span, then resource attributes).
      # user.action -> label user_action ("<METHOD> <route template>", set by orders and
      # copied to every downstream span from baggage). Keep dimensions low-cardinality.
      dimensions: [user.action]

overrides:
  defaults:
    compaction:
      block_retention: 72h
    metrics_generator:
      processors: [service-graphs, span-metrics]
      generate_native_histograms: classic   # traces_spanmetrics_latency_bucket (+exemplars)

usage_report:
  reporting_enabled: false
